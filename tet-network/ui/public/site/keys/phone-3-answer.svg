<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" role="img" aria-labelledby="t">
  <title id="t">A generic phone sends only the answer; the site sees that a key answered, not who you are</title>
  <style>
    .bg{fill:#f0fdfa}.body{fill:#1e293b}.screen{fill:#ffffff}.card{fill:#ffffff;stroke:#cbd5e1}.ink{fill:#0f766e}.inks{stroke:#0f766e}.deep{fill:#134e4a}
    .soft{fill:#ccfbf1}.mute{fill:#94a3b8}.mutes{stroke:#94a3b8}.no{stroke:#e11d48}.line{fill:#e2e8f0}.chip{fill:#e2e8f0;stroke:#475569}.on{fill:#ffffff}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0b1f1e}.body{fill:#334155}.screen{fill:#0f172a}.card{fill:#0f172a;stroke:#334155}.ink{fill:#2dd4bf}.inks{stroke:#2dd4bf}.deep{fill:#99f6e4}
      .soft{fill:#134e4a}.mute{fill:#64748b}.mutes{stroke:#64748b}.no{stroke:#fb7185}.line{fill:#1e293b}.chip{fill:#1e293b;stroke:#94a3b8}.on{fill:#042f2e}
    }
  </style>
  <rect class="bg" width="320" height="420" rx="24"/>
  <rect class="body" x="70" y="24" width="180" height="372" rx="30"/>
  <rect class="screen" x="80" y="44" width="160" height="332" rx="20"/>
  <rect class="mute" x="140" y="32" width="40" height="5" rx="2.5"/>
  <!-- the phone shows: answered -->
  <circle class="soft" cx="160" cy="150" r="46"/>
  <path class="inks" d="M138 150 l15 15 l30 -32" fill="none" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="line" x="104" y="216" width="112" height="9" rx="4.5"/>
  <rect class="line" x="118" y="232" width="84" height="9" rx="4.5"/>
  <!-- the answer leaves the phone; the key stays -->
  <path class="mutes" d="M160 262 v40" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 6"/>
  <!-- what the site sees -->
  <rect class="card" x="18" y="306" width="284" height="80" rx="14" stroke-width="2"/>
  <g transform="translate(40 330) scale(0.6)">
    <circle class="inks" cx="20" cy="20" r="14" fill="none" stroke-width="8"/>
    <rect class="ink" x="32" y="15" width="50" height="10" rx="5"/>
  </g>
  <rect class="line" x="98" y="337" width="64" height="10" rx="5"/>
  <path class="inks" d="M176 344 l9 9 l18 -20" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(236 322)">
    <circle class="mute" cx="18" cy="12" r="8"/>
    <path class="mute" d="M4 38 q14 -28 28 0 z"/>
    <circle class="no" cx="18" cy="22" r="20" fill="none" stroke-width="3.5"/>
    <line class="no" x1="4" y1="8" x2="32" y2="36" stroke-width="3.5"/>
  </g>
</svg>
