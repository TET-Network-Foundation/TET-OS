<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" role="img" aria-labelledby="t">
  <title id="t">An agent signs a message with its own key, and anyone can check the signature</title>
  <style>.bg{fill:#f0fdfa}.pr{fill:#0f766e}.prs{stroke:#0f766e}.ink{fill:#134e4a}.inks{stroke:#134e4a}.lt{fill:#5eead4}.paper{fill:#ffffff}.mu{stroke:#94a3b8}.muf{fill:#94a3b8}.no{fill:#be123c}.nos{stroke:#be123c}.ok{fill:#047857}.oks{stroke:#047857}@media (prefers-color-scheme: dark){.bg{fill:#042f2e}.pr{fill:#2dd4bf}.prs{stroke:#2dd4bf}.ink{fill:#ccfbf1}.inks{stroke:#ccfbf1}.lt{fill:#99f6e4}.paper{fill:#0f172a}.mu{stroke:#64748b}.muf{fill:#64748b}.no{fill:#fb7185}.nos{stroke:#fb7185}.ok{fill:#34d399}.oks{stroke:#34d399}}</style>
  <rect class="bg" width="480" height="240" rx="24"/>
  <!-- the agent: a program window with a small face -->
  <g transform="translate(24 56)">
    <rect class="pr" x="0" y="0" width="116" height="96" rx="14"/>
    <rect class="ink" x="0" y="0" width="116" height="22" rx="10"/>
    <circle class="lt" cx="14" cy="11" r="4"/><circle class="lt" cx="28" cy="11" r="4"/>
    <circle class="paper" cx="40" cy="54" r="9"/><circle class="paper" cx="76" cy="54" r="9"/>
    <path d="M44 76 h28" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  </g>
  <!-- its key, below it -->
  <g transform="translate(46 166)">
    <circle class="prs" cx="12" cy="14" r="10" fill="none" stroke-width="6"/>
    <rect class="pr" x="21" y="11" width="44" height="6" rx="3"/>
    <rect class="pr" x="52" y="17" width="5" height="9"/><rect class="pr" x="60" y="17" width="5" height="7"/>
  </g>
  <!-- the signed message -->
  <path class="mu" d="M150 104 h28" stroke-width="3" stroke-dasharray="5 5" fill="none"/>
  <g transform="translate(184 50)">
    <rect class="paper prs" x="0" y="0" width="112" height="136" rx="12" stroke-width="3"/>
    <rect class="muf" x="18" y="22" width="76" height="7" rx="3"/><rect class="muf" x="18" y="40" width="60" height="7" rx="3"/>
    <rect class="muf" x="18" y="58" width="70" height="7" rx="3"/>
    <circle class="pr" cx="80" cy="104" r="18"/>
    <circle class="paper" cx="74" cy="104" r="5"/><rect class="paper" x="78" y="102" width="14" height="4" rx="2"/>
  </g>
  <!-- the check: a magnifier with a tick -->
  <path class="mu" d="M304 118 h28" stroke-width="3" stroke-dasharray="5 5" fill="none"/>
  <g transform="translate(340 66)">
    <circle class="paper prs" cx="50" cy="50" r="40" stroke-width="8"/>
    <path class="inks" d="M80 80 l30 30" stroke-width="12" stroke-linecap="round"/>
    <path class="oks" d="M32 50 l12 12 l22 -24" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
