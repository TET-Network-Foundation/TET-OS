<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img" aria-labelledby="t">
  <title id="t">A signed listing, a receipt from the shop, and a review that counts only with that receipt</title>
  <style>
    .bg{fill:#f0fdfa}.ink{fill:#0f766e}.inks{stroke:#0f766e}.deep{fill:#134e4a}.card{fill:#ffffff}.cards{stroke:#cbd5e1}
    .line{stroke:#94a3b8}.slate{fill:#334155}.amber{fill:#d97706}.ambers{stroke:#d97706}.red{stroke:#b91c1c}.redf{fill:#b91c1c}
    .soft{fill:#ccfbf1}.badge{fill:#0f172a}.badget{fill:#ffffff;font:700 14px system-ui,sans-serif}.star{fill:#f59e0b}
    @media (prefers-color-scheme: dark){
      .bg{fill:#042f2e}.ink{fill:#5eead4}.inks{stroke:#5eead4}.deep{fill:#99f6e4}.card{fill:#0f172a}.cards{stroke:#334155}
      .line{stroke:#64748b}.slate{fill:#cbd5e1}.amber{fill:#fbbf24}.ambers{stroke:#fbbf24}.red{stroke:#f87171}.redf{fill:#f87171}
      .soft{fill:#115e59}.badge{fill:#f8fafc}.badget{fill:#0f172a}.star{fill:#fbbf24}
    }
    .checks{stroke:#ffffff}@media (prefers-color-scheme: dark){.checks{stroke:#042f2e}}
  </style>
  <defs><g id="seal"><circle r="11" class="ink"/><path d="M-5 0 l3.5 4 l7 -8" fill="none" class="checks" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g> <polygon id="star" points="0,-7 1.76,-2.43 6.66,-2.16 2.85,0.93 4.11,5.66 0,3 -4.11,5.66 -2.85,0.93 -6.66,-2.16 -1.76,-2.43"/></defs>
  <rect width="400" height="260" rx="24" class="bg"/>
  <!-- 1 the shop signs its listing -->
  <g transform="translate(24 40)"><rect x="0" y="0" width="90" height="18" rx="4" class="ink"/><path d="M0 18 h90 l-7.5 8 l-7.5 -8 l-7.5 8 l-7.5 -8 l-7.5 8 l-7.5 -8 l-7.5 8 l-7.5 -8 l-7.5 8 l-7.5 -8 l-7.5 8 l-7.5 -8 l-7.5 8 z" class="ink"/><rect x="6" y="26" width="78" height="52" class="card cards" stroke-width="2"/><rect x="34" y="44" width="22" height="34" class="soft"/><rect x="12" y="36" width="16" height="16" rx="2" class="soft"/><rect x="62" y="36" width="16" height="16" rx="2" class="soft"/></g>
  <rect x="24" y="134" width="90" height="80" rx="10" class="card cards" stroke-width="2"/>
  <rect x="34" y="146" width="44" height="30" rx="4" class="soft"/>
  <rect x="34" y="184" width="60" height="4" rx="2" class="slate"/><rect x="34" y="194" width="40" height="4" rx="2" class="slate"/>
  <use href="#seal" x="96" y="160"/>
  <!-- 2 the shop gives the buyer a signed receipt -->
  <path d="M118 100 C140 96 148 100 156 110" fill="none" class="line" stroke-width="3" stroke-dasharray="6 6"/>
  <path d="M160 74 h64 v84 l-8 -6 l-8 6 l-8 -6 l-8 6 l-8 -6 l-8 6 l-8 -6 l-8 6 z" class="card inks" stroke-width="2.5"/>
  <rect x="170" y="88" width="44" height="4" rx="2" class="slate"/><rect x="170" y="98" width="32" height="4" rx="2" class="slate"/><rect x="170" y="108" width="40" height="4" rx="2" class="slate"/>
  <use href="#seal" x="192" y="132"/>
  <path d="M228 100 C244 90 250 82 258 78" fill="none" class="line" stroke-width="3" stroke-dasharray="6 6"/>
  <!-- 3 a review with that receipt counts -->
  <rect x="262" y="34" width="120" height="84" rx="10" class="card inks" stroke-width="2.5"/>
  <g class="star"><use href="#star" x="280" y="56"/><use href="#star" x="298" y="56"/><use href="#star" x="316" y="56"/><use href="#star" x="334" y="56"/></g>
  <use href="#star" x="352" y="56" class="soft"/>
  <rect x="274" y="74" width="70" height="4" rx="2" class="slate"/><rect x="274" y="84" width="50" height="4" rx="2" class="slate"/>
  <path d="M274 96 h20 v14 l-3 -2 l-3 2 l-3 -2 l-3 2 l-3 -2 l-3 2 l-2 -2 z" class="soft"/>
  <use href="#seal" x="362" y="100"/>
  <!-- a review without a receipt does not -->
  <g opacity="0.6">
    <rect x="262" y="146" width="120" height="76" rx="10" class="card cards" stroke-width="2.5"/>
    <g class="star"><use href="#star" x="280" y="168"/><use href="#star" x="298" y="168"/><use href="#star" x="316" y="168"/><use href="#star" x="334" y="168"/><use href="#star" x="352" y="168"/></g>
    <rect x="274" y="186" width="70" height="4" rx="2" class="slate"/><rect x="274" y="196" width="50" height="4" rx="2" class="slate"/>
  </g>
  <circle cx="362" cy="206" r="11" class="card red" stroke-width="3"/>
  <path d="M357 201 l10 10 M367 201 l-10 10" class="red" stroke-width="3" stroke-linecap="round"/>
  <g transform="translate(24 32)"><circle r="12" class="badge"/><text y="5" text-anchor="middle" class="badget">1</text></g>
  <g transform="translate(160 66)"><circle r="12" class="badge"/><text y="5" text-anchor="middle" class="badget">2</text></g>
  <g transform="translate(262 28)"><circle r="12" class="badge"/><text y="5" text-anchor="middle" class="badget">3</text></g>
</svg>
