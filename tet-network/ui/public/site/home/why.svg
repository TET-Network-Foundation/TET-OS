<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" role="img" aria-labelledby="t">
  <title id="t">Many pages that look alike; only one carries a key mark</title>
  <style>.bg{fill:#f0fdfa}.pr{fill:#0f766e}.prs{stroke:#0f766e}.ink{fill:#134e4a}.inks{stroke:#134e4a}.lt{fill:#5eead4}.lts{stroke:#5eead4}.paper{fill:#ffffff}.mu{stroke:#94a3b8}.muf{fill:#94a3b8}.sl{fill:#cbd5e1}@media (prefers-color-scheme: dark){.bg{fill:#042f2e}.pr{fill:#2dd4bf}.prs{stroke:#2dd4bf}.ink{fill:#ccfbf1}.inks{stroke:#ccfbf1}.lt{fill:#115e59}.lts{stroke:#115e59}.paper{fill:#0f172a}.mu{stroke:#64748b}.muf{fill:#64748b}.sl{fill:#334155}}</style>
  <rect class="bg" width="480" height="260" rx="24"/>
  <defs><g id="p">
    <rect class="paper mu" x="0" y="0" width="80" height="104" rx="8" stroke-width="3"/>
    <rect class="sl" x="12" y="16" width="56" height="8" rx="4"/>
    <rect class="sl" x="12" y="32" width="44" height="8" rx="4"/>
    <rect class="sl" x="12" y="48" width="52" height="8" rx="4"/>
    <rect class="sl" x="12" y="64" width="36" height="8" rx="4"/>
  </g></defs>
  <use href="#p" x="40" y="40"/>
  <use href="#p" x="140" y="40"/>
  <use href="#p" x="240" y="40"/>
  <use href="#p" x="40" y="148" opacity="0.6"/>
  <use href="#p" x="140" y="148" opacity="0.6"/>
  <use href="#p" x="240" y="148" opacity="0.6"/>
  <!-- the one with a mark, pulled out -->
  <g transform="translate(352 70)">
    <rect class="paper prs" x="0" y="0" width="88" height="120" rx="8" stroke-width="4"/>
    <rect class="sl" x="12" y="16" width="64" height="8" rx="4"/>
    <rect class="sl" x="12" y="32" width="48" height="8" rx="4"/>
    <rect class="sl" x="12" y="48" width="56" height="8" rx="4"/>
    <circle class="pr" cx="60" cy="92" r="18"/>
    <circle class="paper" cx="54" cy="92" r="6"/>
    <rect class="paper" x="58" y="89" width="14" height="6" rx="3"/>
  </g>
</svg>
