<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" role="img" aria-labelledby="t">
  <title id="t">A key with three use marks, linked to a small machine</title>
  <style>.bg{fill:#f0fdfa}.pr{fill:#0f766e}.prs{stroke:#0f766e}.ink{fill:#134e4a}.inks{stroke:#134e4a}.lt{fill:#5eead4}.lts{stroke:#5eead4}.paper{fill:#ffffff}.mu{stroke:#94a3b8}.muf{fill:#94a3b8}.sl{fill:#cbd5e1}@media (prefers-color-scheme: dark){.bg{fill:#042f2e}.pr{fill:#2dd4bf}.prs{stroke:#2dd4bf}.ink{fill:#ccfbf1}.inks{stroke:#ccfbf1}.lt{fill:#115e59}.lts{stroke:#115e59}.paper{fill:#0f172a}.mu{stroke:#64748b}.muf{fill:#64748b}.sl{fill:#334155}}</style>
  <rect class="bg" width="480" height="260" rx="24"/>
  <!-- the key -->
  <g transform="translate(48 70)">
    <circle class="prs" cx="36" cy="40" r="26" fill="none" stroke-width="12"/>
    <rect class="pr" x="60" y="34" width="96" height="12" rx="6"/>
    <rect class="pr" x="124" y="44" width="10" height="20" rx="3"/>
    <rect class="pr" x="142" y="44" width="10" height="14" rx="3"/>
    <!-- three uses: one spent, two left -->
    <rect class="pr" x="8" y="104" width="32" height="32" rx="8"/>
    <rect class="paper prs" x="56" y="104" width="32" height="32" rx="8" stroke-width="4"/>
    <rect class="paper prs" x="104" y="104" width="32" height="32" rx="8" stroke-width="4"/>
  </g>
  <!-- the link -->
  <path class="mu" d="M220 110 C 260 110, 270 150, 300 150" fill="none" stroke-width="4" stroke-dasharray="8 8"/>
  <!-- a small machine: a rover with a sensor -->
  <g transform="translate(300 96)">
    <rect class="pr" x="12" y="40" width="132" height="64" rx="14"/>
    <rect class="lt" x="32" y="56" width="40" height="24" rx="6"/>
    <circle class="ink" cx="44" cy="112" r="18"/><circle class="ink" cx="112" cy="112" r="18"/>
    <circle class="paper" cx="44" cy="112" r="6"/><circle class="paper" cx="112" cy="112" r="6"/>
    <rect class="ink" x="104" y="12" width="10" height="30" rx="4"/>
    <circle class="lt" cx="109" cy="10" r="10"/>
  </g>
</svg>
