<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t">
  <title id="t">A key with a counter beside a small machine and a person</title>
  <rect width="400" height="300" rx="24" fill="#f0fdfa"/>
  <!-- the machine: a small rover -->
  <rect x="40" y="170" width="120" height="60" rx="12" fill="#0f766e"/>
  <circle cx="70" cy="238" r="16" fill="#134e4a"/><circle cx="130" cy="238" r="16" fill="#134e4a"/>
  <rect x="88" y="140" width="10" height="32" fill="#134e4a"/><circle cx="93" cy="134" r="10" fill="#5eead4"/>
  <!-- the person -->
  <circle cx="320" cy="150" r="22" fill="#334155"/>
  <path d="M286 240 q34 -70 68 0 z" fill="#334155"/>
  <!-- the key in the middle, with its permission tag -->
  <g transform="translate(160 70)">
    <circle cx="30" cy="40" r="24" fill="none" stroke="#0f766e" stroke-width="10"/>
    <rect x="52" y="35" width="70" height="10" rx="5" fill="#0f766e"/>
    <rect x="100" y="45" width="8" height="16" fill="#0f766e"/><rect x="114" y="45" width="8" height="12" fill="#0f766e"/>
    <rect x="28" y="86" width="76" height="44" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="3"/>
    <text x="66" y="116" font-family="system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#0f766e">1 ×</text>
  </g>
  <path d="M160 200 q-10 -40 20 -70" fill="none" stroke="#94a3b8" stroke-width="3" stroke-dasharray="6 6"/>
  <path d="M300 130 q-10 -40 -40 -40" fill="none" stroke="#94a3b8" stroke-width="3" stroke-dasharray="6 6"/>
</svg>
