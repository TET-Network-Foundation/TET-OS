<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" role="img" aria-labelledby="t">
  <title id="t">Several machines, each with its own key, and one check in the middle</title>
  <style>.bg{fill:#f0fdfa}.pr{fill:#0f766e}.prs{stroke:#0f766e}.ink{fill:#134e4a}.inks{stroke:#134e4a}.lt{fill:#5eead4}.lts{stroke:#5eead4}.paper{fill:#ffffff}.mu{stroke:#94a3b8}.muf{fill:#94a3b8}.sl{fill:#cbd5e1}@media (prefers-color-scheme: dark){.bg{fill:#042f2e}.pr{fill:#2dd4bf}.prs{stroke:#2dd4bf}.ink{fill:#ccfbf1}.inks{stroke:#ccfbf1}.lt{fill:#115e59}.lts{stroke:#115e59}.paper{fill:#0f172a}.mu{stroke:#64748b}.muf{fill:#64748b}.sl{fill:#334155}}</style>
  <rect class="bg" width="480" height="260" rx="24"/>
  <g class="mu" stroke-width="3" stroke-dasharray="6 8" fill="none">
    <path d="M100 80 L216 128"/><path d="M380 80 L264 128"/><path d="M100 200 L216 140"/><path d="M380 200 L264 140"/>
  </g>
  <!-- the check -->
  <circle class="paper prs" cx="240" cy="132" r="30" stroke-width="6"/>
  <path class="prs" d="M262 154 L290 182" stroke-width="10" stroke-linecap="round"/>
  <path class="prs" d="M228 132 l8 8 l14 -16" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- machine: rover -->
  <g transform="translate(52 48)">
    <rect class="pr" x="0" y="20" width="72" height="34" rx="9"/>
    <circle class="ink" cx="18" cy="58" r="9"/><circle class="ink" cx="54" cy="58" r="9"/>
    <circle class="prs" cx="84" cy="8" r="7" fill="none" stroke-width="4"/><rect class="pr" x="90" y="6" width="18" height="4" rx="2"/>
  </g>
  <!-- machine: arm -->
  <g transform="translate(340 34)">
    <rect class="ink" x="0" y="62" width="56" height="12" rx="5"/>
    <rect class="pr" x="22" y="26" width="12" height="38" rx="5"/>
    <rect class="pr" x="22" y="0" width="12" height="40" rx="5" transform="rotate(35 28 30)"/>
    <circle class="prs" cx="-12" cy="10" r="7" fill="none" stroke-width="4"/><rect class="pr" x="-6" y="8" width="18" height="4" rx="2" transform="rotate(180 3 10)"/>
  </g>
  <!-- machine: small box with antenna (an agent's computer) -->
  <g transform="translate(56 172)">
    <rect class="pr" x="0" y="8" width="72" height="48" rx="8"/>
    <rect class="lt" x="10" y="18" width="52" height="28" rx="4"/>
    <circle class="prs" cx="88" cy="0" r="7" fill="none" stroke-width="4"/><rect class="pr" x="94" y="-2" width="18" height="4" rx="2"/>
  </g>
  <!-- machine: drone -->
  <g transform="translate(352 178)">
    <rect class="pr" x="8" y="16" width="44" height="22" rx="8"/>
    <rect class="ink" x="-8" y="8" width="28" height="5" rx="2"/><rect class="ink" x="40" y="8" width="28" height="5" rx="2"/>
    <rect class="ink" x="4" y="10" width="4" height="10"/><rect class="ink" x="52" y="10" width="4" height="10"/>
    <circle class="prs" cx="-20" cy="34" r="7" fill="none" stroke-width="4"/><rect class="pr" x="-14" y="32" width="18" height="4" rx="2" transform="rotate(180 -5 34)"/>
  </g>
</svg>
