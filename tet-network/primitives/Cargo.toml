[package]
name = "tet-primitives"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
codec = { package = "parity-scale-codec", version = "3.7.4", default-features = false, features = ["derive"] }
scale-info = { version = "2.11.6", default-features = false, features = ["derive"] }
sp-core = { version = "36.1.0", default-features = false }
dilithium-rs = { version = "0.2.0", default-features = false }

[features]
default = ["std"]
std = ["codec/std", "scale-info/std", "sp-core/std", "dilithium-rs/std"]

