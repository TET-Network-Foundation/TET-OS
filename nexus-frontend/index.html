<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Network - Web Client</title>
    <style>
        body { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; background: #0a0a0a; color: #00ff00; padding: 20px; }
        button { background: #00ff00; color: #000; padding: 10px 20px; border: none; cursor: pointer; font-weight: bold; }
        input { width: 100%; max-width: 900px; padding: 10px; margin-top: 10px; background: #050505; color: #00ff00; border: 1px solid #00ff00; }
        #log { margin-top: 20px; white-space: pre-wrap; }
        .muted { color: #7CFF7C; opacity: 0.8; }
    </style>
</head>
<body>
    <h1>🌐 Nexus Network Web Node</h1>
    <div class="muted">Wasm Swarm + WebRTC-websys dialing (browser).</div>

    <div style="margin-top: 16px;">
        <button id="connectBtn">Connect to Mesh</button>
    </div>

    <div style="margin-top: 16px;">
        <div class="muted">Bootnode WebRTC multiaddr:</div>
        <input id="addr" value="/ip4/127.0.0.1/udp/7999/webrtc-direct/certhash/<PASTE_FROM_BOOTNODE_LOG>" />
    </div>

    <div id="log"></div>

    <div id="chat-ui" style="display: none; margin-top: 20px;">
        <textarea id="promptInput" rows="4" cols="50" placeholder="Ask Llama3 through the Nexus Mesh..." style="width: 100%; max-width: 900px; background: #050505; color: #00ff00; border: 1px solid #00ff00; padding: 10px;"></textarea><br>
        <button id="sendBtn" style="margin-top: 10px;">Send & Verify (ZK)</button>
        <div id="responseOutput" style="margin-top: 20px; border: 1px solid #00ff00; padding: 10px; min-height: 50px;"></div>
    </div>

    <script type="module">
        import init, { NexusWebClient } from '../nexus-wasm/pkg/nexus_wasm.js';

        const logDiv = document.getElementById('log');
        function log(msg) { logDiv.innerText += msg + '\n'; }

        async function run() {
            await init(); // Load the Wasm module
            log("[system] Wasm module loaded successfully.");

            let client = null;

            document.getElementById('connectBtn').addEventListener('click', async () => {
                try {
                    const addr = document.getElementById('addr').value;
                    log("[network] Initializing Nexus Web Client...");
                    client = new NexusWebClient();
                    const result = await client.connect_to_network(addr);
                    log("[success] " + result);

                    // Demo: show chat UI after dialing.
                    document.getElementById('chat-ui').style.display = 'block';
                } catch (e) {
                    log("[error] " + e);
                }
            });

            document.getElementById('sendBtn').addEventListener('click', async () => {
                try {
                    if (!client) {
                        log("[error] Connect first.");
                        return;
                    }
                    const prompt = document.getElementById('promptInput').value;
                    log("[zk] Verifying RISC Zero receipt in browser...");
                    const out = await client.run_inference(prompt);
                    document.getElementById('responseOutput').innerText = out;
                    log("[success] ZK verified. Response rendered.");
                } catch (e) {
                    document.getElementById('responseOutput').innerText = '';
                    logDiv.innerText += "[error] " + e + "\n";
                }
            });
        }
        run();
    </script>
</body>
</html>
