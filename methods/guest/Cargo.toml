[package]
name = "nexus-guest"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
risc0-zkvm = { version = "3.0.5", default-features = false }
sha2 = { version = "0.10", default-features = false }
hex = { version = "0.4", default-features = false }
serde = { version = "1", default-features = false, features = ["derive"] }
nexus-protocol = { path = "../../nexus-protocol", default-features = false }


# RISC Zero's accelerated SHA-256. The guest is entirely SHA (leaf, 20 Merkle levels, nullifier),
# so this is the one dependency whose speed matters. Patching rather than calling
# `risc0_zkvm::sha::Impl` directly keeps ONE `sha2` implementation shared with the host and
# nexus-protocol -- a guest-only hash path is exactly how host/guest constructions drift apart.
[patch.crates-io]
sha2 = { git = "https://github.com/risc0/RustCrypto-hashes", tag = "sha2-v0.10.8-risczero.0" }
