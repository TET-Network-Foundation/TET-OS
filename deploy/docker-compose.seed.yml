# Public seed overlay — the profile the Helsinki bootnode runs.
#
#     docker compose -f docker-compose.yml -f deploy/docker-compose.seed.yml up -d tet-core
#
# `deploy/provision-seed.sh` applies this automatically. Three deltas from the
# base stack, each of them either security or fit:
#
#  1. **REST binds to loopback.** Docker publishes a port by writing its own
#     iptables DNAT rules into the `DOCKER` chain, which ufw never inspects —
#     `ufw deny 5010` does NOT close a port published on 0.0.0.0. The only
#     host-level close that actually holds is to not publish it publicly. The
#     Hetzner cloud firewall blocks 5010 upstream as well; this is the layer
#     that survives someone editing that firewall. Reach the API over an SSH
#     tunnel: `ssh -L 5010:127.0.0.1:5010 root@<seed>`.
#
#  2. **Only 8002/tcp is published.** All three swarms build
#     `tcp::tokio::Transport` and nothing else — block plane `p2p.rs:1233`,
#     nexus `p2p_network.rs:509`, ledger `network.rs:141`. There is no QUIC
#     and no webrtc-direct listener, so the base file's 8002/udp publish binds
#     a docker-proxy for a protocol no code speaks.
#
#  3. **`ui` is not started** — the provisioner runs `up -d tet-core`. A seed
#     serves P2P plus a loopback REST surface; the UI would sit unreachable
#     behind the firewall and costs a multi-minute Next.js build on 2 vCPUs.
#
# `!override` (Compose Spec, docker compose >= 2.24) replaces the base `ports`
# list outright. Without it Compose *appends*, and the public 0.0.0.0:5010
# publish from the base file would survive.

services:
  tet-core:
    ports: !override
      - "127.0.0.1:5010:5010"
      - "8002:8002/tcp"
