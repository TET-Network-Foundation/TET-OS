[package]
name = "nexus-protocol"
version = "0.1.0"
edition = "2024"
license.workspace = true

[lib]
crate-type = ["rlib"]

[dependencies]
serde = { version = "1", default-features = false, features = ["derive"] }
sha2 = { version = "0.10", default-features = false }
hkdf = { version = "0.12", default-features = false }

[features]
# Enable std by default for host usage; guest/wasm can disable default features.
default = ["std"]
std = ["serde/std"]

