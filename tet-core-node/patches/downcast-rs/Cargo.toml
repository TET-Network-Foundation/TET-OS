[package]
name = "downcast-rs"
version = "1.2.1"
edition = "2021"
authors = ["Ashish Myles <marcianx@gmail.com>", "Runji Wang <wangrunji0408@163.com>"]
description = "Trait object downcasting (vendored patch: default features empty for Substrate wasm build-std)."
license = "MIT OR Apache-2.0"
repository = "https://github.com/marcianx/downcast-rs"
readme = "README.md"

[features]
# crates.io default enables `std`, which breaks wasm32 + `-Z build-std` (duplicate `exchange_malloc`).
default = []
std = []

[lib]
path = "src/lib.rs"
