# TET CI — Sprint 4 "L1 Foundation" exit criterion: *CI green on the default branch*.
#
# Three jobs, each closing a gap named in docs/SPRINT_PLAN.md §S4:
#   rust  — the node actually builds and its 182 tests pass somewhere other than a laptop.
#           Every "PASS" in the first 65 commits was a local run; this is the first enforced one.
#   ui    — the Sovereign OS front end builds from a clean checkout.
#   wasm  — tet-pqc-wasm builds and lands in tet-network/ui/public/pqc/. That directory is
#           gitignored (`*`), so a fresh clone cannot sign anything until this runs; see
#           docs/RUNNING_A_NODE.md "post-quantum WASM (required)".
#
# RISC0_SKIP_BUILD=1 is set workflow-wide: building the RISC Zero guests needs the risc0
# toolchain and puts the run into the tens of minutes. The zk path is therefore NOT covered
# here — that is the open `zk` job in docs/SPRINT_PLAN.md (v1 S3 item 1).

name: CI

# Every push and every pull request runs this workflow. There are no path filters, and that is a
# deliberate reversal of the earlier design.
#
# `paths-ignore` saves minutes but reports NO STATUS when it skips — not success — so a required check
# leaves docs-only PRs unmergeable. The previous answer was a second workflow declaring the same five
# job names on the complementary paths. That answer was wrong: see the `gate` job below for what it
# cost on 2026-10-01.
#
# Instead, one workflow always runs, the `gate` job decides whether the expensive work is needed, and
# every named job STARTS either way so its check name is always reported. A docs-only commit costs
# five runners at GitHub's one-minute minimum — about five billed minutes, which is what the no-op
# mirror cost anyway — and buys back the ability to trust the checks.
on:
  push:
    branches: [main]
  pull_request:
  # Manual trigger. `git commit --allow-empty` is not a substitute: a push with no changed files
  # cannot match a path filter, and before this existed such a push was skipped rather than run. When
  # a green run is needed on demand — a flip gate, a re-check after a runner outage — this is it.
  workflow_dispatch:

# A second push to the same branch cancels the first — private-repo Actions minutes are billed.
#
# The group is a LITERAL, not `${{ github.workflow }}`. Two workflows that share a name share that
# expression's value and therefore cancel each other; that is how the no-op mirror killed the real CI
# run on 2026-10-01. Nothing else may use the group `ci-`.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RISC0_SKIP_BUILD: "1"

jobs:
  # Which half of CI this commit needs.
  #
  # ONE workflow decides it. The previous design was two: ci.yml with `paths-ignore` and a no-op
  # ci-noop.yml with `paths`, both named "CI", both declaring the same five job names, on the theory
  # that complementary path sets are mutually exclusive. They are not. A single push can change files
  # in BOTH sets, and then both workflows trigger.
  #
  # On 2026-10-01 that is exactly what happened: a push touching .github/** and docs/FLIP_DAY.md fired
  # both. They shared `name: CI`, so `${{ github.workflow }}-${{ github.ref }}` resolved to the same
  # concurrency group, and with cancel-in-progress the mirror killed the real run — run 36844275750
  # ended `cancelled` with `started=never` on all five jobs while run 36844275776 reported all five
  # names green. A required check satisfied by a workflow that did nothing. Even without the
  # cancellation the hole remains: two check runs sharing a name means the later one wins, so a mirror
  # can mask a real failure.
  #
  # FAIL-SAFE DIRECTION: anything this job cannot work out means code=true. "Docs only" is the guess
  # that reports success without testing anything, so it is never the default.
  gate:
    name: gate (what changed)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Needed to diff against the pushed-from commit; a shallow clone cannot.
          fetch-depth: 0

      - name: classify
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          code=true
          reason="fail-safe default"
          base=""
          case "$EVENT" in
            push) base="$BEFORE" ;;
            pull_request) base="$PR_BASE" ;;
            *) reason="event '$EVENT' has no diff base — run everything" ;;
          esac

          if [ "$EVENT" = "push" ] || [ "$EVENT" = "pull_request" ]; then
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              reason="no usable base ('$base') — run everything"
            else
              files="$(git diff --name-only "$base" "$HEAD_SHA")"
              if [ -z "$files" ]; then
                # An empty diff proves nothing about what changed, so it does not buy the cheap path.
                reason="diff was empty — run everything rather than assume"
              else
                echo "changed files:"
                printf '%s\n' "$files" | sed 's/^/  /'
                # Identical to the paths-ignore list this replaces: **/*.md, docs/**, the two
                # licences, .gitignore.
                nondocs="$(printf '%s\n' "$files" \
                  | grep -vE '\.md$|^docs/|^LICENSE-APACHE$|^LICENSE-MIT$|^\.gitignore$' || true)"
                if [ -n "$nondocs" ]; then
                  reason="non-documentation files changed"
                  echo "non-documentation files:"
                  printf '%s\n' "$nondocs" | sed 's/^/  /'
                else
                  code=false
                  reason="documentation only"
                fi
              fi
            fi
          fi

          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "EXPENSIVE_PATH=$code"
          echo "::notice::expensive path: $code ($reason)"

  rust:
    name: rust (build, test, guards)
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # This job ALWAYS starts, including for a docs-only commit, so its check name is
      # always reported. A job skipped by a job-level `if:` reports "skipped", which a
      # required-checks ruleset does not accept as a pass — the same trap as the no-op
      # mirror this replaces. So the JOB runs and the WORK is conditional.
      - name: Docs-only commit — skipping the work, not the check
        if: needs.gate.outputs.code != 'true'
        # Explicit, because this step runs BEFORE the checkout it is replacing. The `ui` job sets
        # `defaults.run.working-directory: tet-network/ui`, which does not exist yet on the cheap
        # path, and bash cannot start in a missing directory: run 36856444106 failed with
        # "An error occurred trying to start process '/usr/bin/bash' with working directory
        # '.../tet-network/ui'. No such file or directory" — a green-looking job design brought down
        # by its own skip step. Set on every job so the next one to gain a `defaults` block does not
        # rediscover this.
        working-directory: .
        run: |
          echo 'Only documentation changed; nothing in this job can be broken by it.'
          echo "Reporting success so the required check 'rust (build, test, guards)' is satisfied."

      - if: needs.gate.outputs.code == 'true'
        uses: actions/checkout@v4

      - if: needs.gate.outputs.code == 'true'
        name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # `ubuntu-latest` ships ~14 GB free, and this workspace does not fit: the
      # first run died with "No space left on device" after Build and Test had
      # both already passed. Reclaiming the preinstalled SDKs buys ~25 GB.
      - if: needs.gate.outputs.code == 'true'
        name: Free disk space
        run: |
          echo "before: $(df -h / --output=avail | tail -1)"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          echo "after:  $(df -h / --output=avail | tail -1)"

      - if: needs.gate.outputs.code == 'true'
        name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          key: rust-${{ hashFiles('**/Cargo.lock') }}

      # Release-build only the binary that actually ships. The full
      # `--workspace --release` compiled every crate a second time in a second
      # profile for no coverage the debug test build does not already give, and
      # the `docker` job release-builds this same binary inside the image.
      - if: needs.gate.outputs.code == 'true'
        name: Build (release)
        run: cargo build --release -p tet-core --bin TET-Core

      # Debuginfo is the bulk of the debug target dir. Line tables keep test
      # backtraces readable without carrying full DWARF for every dependency.
      - if: needs.gate.outputs.code == 'true'
        name: Test
        env:
          CARGO_PROFILE_DEV_DEBUG: line-tables-only
          CARGO_PROFILE_TEST_DEBUG: line-tables-only
        run: cargo test --workspace

      # A CLI is a surface no cargo test touches, and `verify` returning 0 on a bad signature is
      # exactly the defect a unit test cannot see. The script asserts both directions: the SDK's
      # envelopes verify, tet-cli's own signing reproduces them byte for byte, and verify EXITS
      # NON-ZERO for another chain and for a payload that is not what was signed.
      - if: needs.gate.outputs.code == 'true'
        name: agent identity — tet-cli verifies what the SDK signed
        run: |
          set -euo pipefail
          cargo build -p tet-cli
          tet-cli/scripts/agent_cli_interop.sh target/debug/tet-cli

      # Node lives in this job rather than a new one: the end-to-end check below needs BOTH the Rust
      # binaries and the SDK, and installing Node here is far cheaper than installing Rust in the ui
      # job. No new job, so the five required check names stay exactly as the ruleset lists them.
      - if: needs.gate.outputs.code == 'true'
        name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The whole point of GET /chain: an agent cannot DERIVE the genesis hash, because tet-core
      # computes it from treasury configuration. This starts a real node, lets the SDK discover the
      # binding with TET_CHAIN_ID and TET_GENESIS_HASH UNSET — the signing step refuses to run if
      # either is set, so "it worked" cannot mean "it was told" — signs, and has tet-core's verifier
      # accept it. Then it checks the served hash is derived rather than constant by starting a second
      # node with a different treasury.
      - if: needs.gate.outputs.code == 'true'
        name: agent identity — GET /chain discovery, end to end
        run: |
          set -euo pipefail
          (cd tet-agent-sdk && npm ci --silent && npm run build --silent)
          cargo build -p tet-core --bin TET-Core
          tet-cli/scripts/agent_chain_discovery.sh target/debug/TET-Core target/debug/tet-cli

      # `always()` so disk usage is reported even when the build above failed — that is when it
      # matters. Combined with the gate rather than written as a second `if:`, because two `if:`
      # keys on one step are duplicate YAML keys: GitHub refuses the whole workflow file, while
      # PyYAML accepts it last-wins. That is how run 36845749022 ended with zero jobs.
      - if: always() && needs.gate.outputs.code == 'true'
        name: Disk after build+test
        run: df -h / | tail -1

      # The suite above already ran these. This step re-runs them BY NAME so the workflow fails
      # loudly if one is ever deleted or renamed rather than fixed: a `cargo test <filter>` that
      # matches nothing exits 0, so each run is asserted to have executed exactly one test.
      #
      # Inventory as of 2026-09-22: SIX tests carry `SECURITY REGRESSION GUARD`, FOUR carry
      # `TODO(9828)`, and SEVEN guard transaction delivery (added 2026-09-22). The newest,
      # follower_tx_settles_on_the_mining_peer_with_gossip_disabled, is the second-path guard:
      # a follower whose gossip publishes reach nobody must still get its tx mined over
      # /tet/v1/tx-submit. Delete that protocol and it fails. The two newest guard the removal of the dev signature fallback, so testnet
      # verifies exactly like mainnet. A related non-guard test,
      # `mainnet_rejects_legacy_tx_signature_without_chain_binding`, covers the mainnet side and
      # runs with the rest of the suite.
      #
      # There is still no guard for the removed faucet routes (`POST /ledger/faucet`,
      # `POST /faucet`, removed in c2416dc) — `admin_rest_faucet_once_per_wallet_and_ip_rl` still
      # exercises the *ledger method*, which is unrouted, so nothing would catch the routes being
      # re-added. Adding `removed_faucet_routes_are_not_reachable` alongside the /dex/* guard is
      # the obvious next commit; add its name below when it exists.
      - if: needs.gate.outputs.code == 'true'
        name: Security regression guards + block-9828 pins
        env:
          # Must match the Test step or cargo recompiles the whole test binary.
          CARGO_PROFILE_DEV_DEBUG: line-tables-only
          CARGO_PROFILE_TEST_DEBUG: line-tables-only
        run: |
          set -euo pipefail
          guards=(
            gossiped_ai_result_writes_no_balance
            invalid_zk_receipt_is_rejected_without_slashing
            invalid_zk_candidate_is_rejected_without_slashing
            removed_genesis_1k_claim_route_is_not_reachable
            removed_mint_demo_route_is_not_reachable
            removed_guardian_recover_route_is_not_reachable
            removed_dex_routes_are_not_reachable
            zkcourt_challenge_without_signature_is_rejected_and_locks_no_bond
            caac_complete_without_signature_is_rejected_and_writes_no_record
            bare_json_signed_envelope_is_rejected_off_mainnet
            envelope_signed_against_a_different_genesis_hash_is_rejected
            anonymous_post_names_no_poster_to_the_node
            anonymous_mail_from_six_members_is_all_retained
            anonymous_mail_is_capped_per_receiver
            stalled_block_plane_exits_the_process_past_the_hard_threshold
            stalled_block_plane_below_the_hard_threshold_keeps_running
            sole_validator_keeps_mining_after_its_last_peer_leaves
            sole_validator_still_gates_on_a_peer_ahead
            defaulted_validator_set_is_not_a_sole_validator
            catch_up_tick_and_sync_gate_never_deadlock
            sync_state_lock_is_never_held_across_an_await
            public_mode_refuses_every_route_off_the_allowlist
            public_mode_lets_every_allowlisted_route_through
            public_mode_rate_limit_fires_per_client
            public_mode_is_off_by_default
            public_mode_ignores_forwarded_for_from_an_untrusted_peer
            public_mode_limits_ipv6_per_slash_64
            ui_signed_agent_manifest_is_byte_identical_in_rust
          )
          pins=(
            wallclock_time_changes_spendability_for_the_same_block
            state_root_paths_agree_on_unreadable_rows
            consensus_faucet_path_keeps_nodes_in_agreement
            ai_infer_settlement_direct_write_forks_state_root
          )
          # Transaction gossip — the S4 Foundation gate. A follower must be able to submit a tx
          # its peer mines; a gossiped tx must clear the same bar as a REST-submitted one; and
          # receiving a tx must never make us re-publish it. Note the first name is
          # module-qualified: it lives in `mod block_sync` because it needs two real swarms.
          tx_gossip=(
            block_sync::at_f1_follower_submits_tx_and_mining_peer_settles_it
            block_sync::at_f1_follower_sends_money_and_producer_settles_it
            block_sync::follower_tx_settles_on_the_mining_peer_with_gossip_disabled
            block_sync::swarm_keeps_serving_after_the_publish_channel_closes
            pending_local_tx_is_rebroadcast_until_mined_then_forgotten
            gossiped_tx_already_mined_is_dropped_not_requeued
            gossiped_tx_is_never_marked_for_rebroadcast
            gossiped_tx_with_a_broken_signature_is_rejected
            gossiped_tx_duplicate_is_queued_once
          )
          fail=0
          for t in "${guards[@]}" "${pins[@]}" "${tx_gossip[@]}"; do
            out=$(cargo test --bin TET-Core -- --exact "tests::$t" 2>&1) || { echo "$out"; fail=1; }
            if ! grep -q '1 passed; 0 failed' <<<"$out"; then
              echo "::error::$t did not run as exactly one passing test — renamed, deleted, or failing"
              grep -E 'test result:' <<<"$out" || true
              fail=1
            else
              echo "ok  $t"
            fi
          done
          exit $fail

      # NON-BLOCKING, deliberately. The tree is not clippy-clean: 37 warnings as of 2026-09-20
      # (tet-core 28, tet-pqc-wasm 3), of which 3 are plain rustc `unused` warnings
      # left by the faucet-route removal and the rest are style lints (collapsible_if,
      # redundant_closure, too_many_arguments, needless_return, doc_lazy_continuation ...).
      # Turning on `-D warnings` today would make CI red on arrival and teach everyone to ignore it.
      # Clean the 37, then delete `continue-on-error` and add `-- -D warnings` in the same commit.
      - if: needs.gate.outputs.code == 'true'
        name: Clippy (non-blocking until the tree is clean)
        continue-on-error: true
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets 2>&1 | tee clippy.log || true
          n=$(grep -cE '^warning: ' clippy.log || true)
          echo "### Clippy: $n warnings (non-blocking)" >> "$GITHUB_STEP_SUMMARY"
          grep -E '^warning: .* generated [0-9]+ warnings' clippy.log >> "$GITHUB_STEP_SUMMARY" || true

  ui:
    name: ui (next build)
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tet-network/ui
    steps:
      # This job ALWAYS starts, including for a docs-only commit, so its check name is
      # always reported. A job skipped by a job-level `if:` reports "skipped", which a
      # required-checks ruleset does not accept as a pass — the same trap as the no-op
      # mirror this replaces. So the JOB runs and the WORK is conditional.
      - name: Docs-only commit — skipping the work, not the check
        if: needs.gate.outputs.code != 'true'
        # Explicit, because this step runs BEFORE the checkout it is replacing. The `ui` job sets
        # `defaults.run.working-directory: tet-network/ui`, which does not exist yet on the cheap
        # path, and bash cannot start in a missing directory: run 36856444106 failed with
        # "An error occurred trying to start process '/usr/bin/bash' with working directory
        # '.../tet-network/ui'. No such file or directory" — a green-looking job design brought down
        # by its own skip step. Set on every job so the next one to gain a `defaults` block does not
        # rediscover this.
        working-directory: .
        run: |
          echo 'Only documentation changed; nothing in this job can be broken by it.'
          echo "Reporting success so the required check 'ui (next build)' is satisfied."

      - if: needs.gate.outputs.code == 'true'
        uses: actions/checkout@v4

      - if: needs.gate.outputs.code == 'true'
        name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tet-network/ui/package-lock.json

      - if: needs.gate.outputs.code == 'true'
        run: npm ci

      - if: needs.gate.outputs.code == 'true'
        run: npm run build

      # The poster's half of the anonymous-send privacy guard: every request the real
      # anon_poster.mjs makes is recorded, and none may name the poster. Plain Node, no build step.
      # The node's half is `anonymous_post_names_no_poster_to_the_node` in the rust job.
      - if: needs.gate.outputs.code == 'true'
        name: anonymous send — the poster names itself to nobody
        run: node scripts/anon_poster_guard.mjs

      # Try TET (docs/DEMO_NODE.md): making the disposable wallet touches no network and no storage,
      # the page names no server-side mnemonic route, and the wallet id is tet-core's derivation.
      - if: needs.gate.outputs.code == 'true'
        name: try page — the disposable wallet stays in the tab
        run: node scripts/try_wallet_guard.mjs

      # Try TET part 1: the board's invite secret never reaches the node, anonymous never falls back
      # to named, labels come from the envelope and the node. Runs the page's own TypeScript modules
      # (Node strips the types; scripts/lib/ts_hooks.mjs resolves them as Next does).
      - if: needs.gate.outputs.code == 'true'
        name: try page — the board's invite stays secret and anonymous never turns named
        run: node --experimental-strip-types scripts/try_board_guard.mjs

      # Try TET part 4: each step of the verdict proves only what it says, on fixtures tet-core
      # itself asserts (agent_payload_envelopes.json; agent_manifest_v1.json, which the rust job
      # re-signs byte for byte in ui_signed_agent_manifest_is_byte_identical_in_rust).
      - if: needs.gate.outputs.code == 'true'
        name: try page — verify anything grades only what it proves
        run: node --experimental-strip-types scripts/try_verify_guard.mjs

      # Lives in this job because it is the one that already has Node; it checks
      # tet-core's artifact, not the UI's. Keeping it here avoids a fifth job --
      # which would cost another billed minute per push AND have to be mirrored in
      # ci-noop.yml, since required-check names must match across both files.
      #
      # WHY THIS EXISTS. src/wallet_client_bundled.js is committed, embedded into the
      # node binary with include_str! and served to browsers at
      # /assets/wallet_client_bundled.js. On 2026-09-28 it was found to be
      # unreproducible: no version combination rebuilt it, because it predated its own
      # source. That staleness was hiding a real bug -- the source signed with ML-DSA-65
      # while the node verifies ML-DSA-44, so an honest rebuild would have broken every
      # browser-signed request. A stale artifact can hide a broken source, so from now on
      # the artifact must be reproducible from the repo or CI fails.
      - if: needs.gate.outputs.code == 'true'
        name: wallet-client bundle is reproducible from the pinned lockfile
        working-directory: tet-core
        run: |
          set -euo pipefail
          committed=$(shasum -a 256 src/wallet_client_bundled.js | cut -d' ' -f1)
          npm ci --silent
          npm run build-wallet-client --silent
          rebuilt=$(shasum -a 256 src/wallet_client_bundled.js | cut -d' ' -f1)
          echo "committed: $committed"
          echo "rebuilt  : $rebuilt"
          if [ "$committed" != "$rebuilt" ]; then
            echo "::error::wallet_client_bundled.js does not match a rebuild from the pinned lockfile."
            echo "Commit the rebuilt bundle together with any dependency change, or pin the"
            echo "dependency that moved. Do NOT commit a bundle nobody can reproduce: the last"
            echo "one hid an ML-DSA level mismatch that would have broken every browser wallet."
            git --no-pager diff --stat -- src/wallet_client_bundled.js || true
            exit 1
          fi
          echo "bundle reproduces byte-for-byte"

      # Also here for the Node it already has. The agent SDK derived Ed25519 with
      # @polkadot/keyring (substrate mini-secret) instead of the BIP39 seed every other TET
      # implementation uses, so the same mnemonic produced two different wallets and nothing
      # rejected either -- both halves were self-consistent. The Rust side pins the fixture; this
      # pins the SDK CODE against it, which is what fails if the old derivation comes back.
      - if: needs.gate.outputs.code == 'true'
        name: agent SDK — derivation and cross-language agent signing
        working-directory: tet-agent-sdk
        run: |
          set -euo pipefail
          npm ci --silent
          npm run build --silent
          out=$(npm test --silent 2>&1)
          echo "$out"
          # jest exits 0 when a filter matches nothing, so the counts are asserted rather than the
          # exit code. The skipped suite is tests/slashing_audit.test.ts, which posts to a route the
          # September clean-up removed; the reason is recorded in the file.
          echo "$out" | grep -qE 'Tests:[[:space:]]+1 skipped, 49 passed, 50 total' || {
            echo "::error::the agent SDK guards did not run — expected 49 passed and 1 skipped"
            exit 1
          }

  shell:
    name: shell (shellcheck deploy scripts)
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # This job ALWAYS starts, including for a docs-only commit, so its check name is
      # always reported. A job skipped by a job-level `if:` reports "skipped", which a
      # required-checks ruleset does not accept as a pass — the same trap as the no-op
      # mirror this replaces. So the JOB runs and the WORK is conditional.
      - name: Docs-only commit — skipping the work, not the check
        if: needs.gate.outputs.code != 'true'
        # Explicit, because this step runs BEFORE the checkout it is replacing. The `ui` job sets
        # `defaults.run.working-directory: tet-network/ui`, which does not exist yet on the cheap
        # path, and bash cannot start in a missing directory: run 36856444106 failed with
        # "An error occurred trying to start process '/usr/bin/bash' with working directory
        # '.../tet-network/ui'. No such file or directory" — a green-looking job design brought down
        # by its own skip step. Set on every job so the next one to gain a `defaults` block does not
        # rediscover this.
        working-directory: .
        run: |
          echo 'Only documentation changed; nothing in this job can be broken by it.'
          echo "Reporting success so the required check 'shell (shellcheck deploy scripts)' is satisfied."

      - if: needs.gate.outputs.code == 'true'
        uses: actions/checkout@v4

      # deploy/ was untested by anything until 2026-09-29, and it is the code with the most
      # authority in the repository: it provisions the seed, deploys to it, and deletes its
      # ledger. reset_db.sh had a hardcoded path that no longer matched where the seed keeps its
      # database, so it would have reported a successful wipe having deleted nothing.
      #
      # shellcheck will not catch a stale path. It does catch the class of mistake that makes a
      # destructive script dangerous rather than merely wrong: unquoted expansions, `rm -rf $VAR/`
      # where VAR can be empty, and `A && B || C` read as if-then-else.
      # In this job because it is the static-analysis job, and because its NAME is a required check
      # name that must not change — "shellcheck deploy scripts" is a literal string in the ruleset.
      # Renaming it to mention YAML would quietly un-require it.
      #
      # It exists because the local check that passed before run 36845749022 was not checking what
      # GitHub checks: PyYAML accepts duplicate keys last-wins, GitHub refuses the file and reports a
      # run with zero jobs. It also refuses a concurrency group built from `github.workflow`, which
      # is how a same-named workflow cancelled the real CI run and reported its check names green.
      - if: needs.gate.outputs.code == 'true'
        name: workflow files are what GitHub will accept
        run: python3 scripts/lint_workflows.py

      - if: needs.gate.outputs.code == 'true'
        name: shellcheck
        run: |
          set -euo pipefail
          shellcheck --version
          # Every script, and the run fails on ANY finding. All are clean as of this commit, so
          # there is no backlog to normalise and a new finding is always new.
          shellcheck deploy/*.sh deploy/tests/*.sh tet-cli/scripts/*.sh

      # The seed monitor's guarantees, against stubbed docker/curl/df/date: a dead node is red,
      # success means the height advanced, a rejected ping is logged, a stale install reports itself.
      # Written after the 2026-10-04 33 h producer wedge (docs/postmortems/2026-10-04-producer-wedge-33h.md).
      - if: needs.gate.outputs.code == 'true'
        name: seed-healthcheck.sh behaves as documented
        run: bash deploy/tests/seed-healthcheck.test.sh

      # The demo node (docs/DEMO_NODE.md): provision refuses an unsafe demo role, and the composed
      # config exposes only Caddy on 80/443, REST on loopback, no UI port, public mode on, the
      # trusted-proxy range equal to the pinned subnet, and a Caddyfile that trusts no client XFF.
      - if: needs.gate.outputs.code == 'true'
        name: the demo node exposes only what the design says
        run: bash deploy/tests/demo-node.test.sh

      # seed-liveness.yml's verdict on healthchecks.io's status: every check "up", at least two,
      # and a malformed or empty answer is a failure, never a pass.
      - if: needs.gate.outputs.code == 'true'
        name: hc_status.py decides liveness as documented
        run: python3 scripts/test_hc_status.py

      # The refusal paths are the whole safety property, so they are asserted rather than assumed.
      # None of these reaches ssh: each exits during argument validation.
      - if: needs.gate.outputs.code == 'true'
        name: reset_db.sh refuses without an explicit, matching confirmation
        run: |
          set -euo pipefail
          refuses() {
            local desc="$1"; shift
            if ./deploy/reset_db.sh "$@" >/dev/null 2>&1; then
              echo "::error::reset_db.sh ACCEPTED a call it must refuse: $desc"
              exit 1
            fi
            echo "ok  refused: $desc"
          }
          refuses "no confirmation flag"        --server 203.0.113.9 --db-path /data/tet.db
          refuses "confirmation names another path" --server 203.0.113.9 --db-path /data/tet.db --yes-delete-the-ledger-at /data/other.db
          refuses "relative path"               --server 203.0.113.9 --db-path tet.db --yes-delete-the-ledger-at tet.db
          refuses "deny-listed path /var"       --server 203.0.113.9 --db-path /var --yes-delete-the-ledger-at /var
          refuses "deny-listed path /"          --server 203.0.113.9 --db-path / --yes-delete-the-ledger-at /
          refuses "missing --server"            --db-path /data/tet.db --yes-delete-the-ledger-at /data/tet.db
          refuses "unknown argument"            --server 203.0.113.9 --wipe-everything
          # The bypass that defeated the old interactive prompt: a pipe is not a terminal, so
          # `read -r -p` was skipped entirely and the wipe proceeded.
          if yes | ./deploy/reset_db.sh --server 203.0.113.9 --db-path /data/tet.db >/dev/null 2>&1; then
            echo "::error::reset_db.sh was satisfied by piping 'yes' — the confirmation is not a flag"
            exit 1
          fi
          echo "ok  refused: piped 'yes' (the old prompt's bypass)"

  wasm:
    name: wasm (tet-pqc-wasm → ui/public/pqc)
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # This job ALWAYS starts, including for a docs-only commit, so its check name is
      # always reported. A job skipped by a job-level `if:` reports "skipped", which a
      # required-checks ruleset does not accept as a pass — the same trap as the no-op
      # mirror this replaces. So the JOB runs and the WORK is conditional.
      - name: Docs-only commit — skipping the work, not the check
        if: needs.gate.outputs.code != 'true'
        # Explicit, because this step runs BEFORE the checkout it is replacing. The `ui` job sets
        # `defaults.run.working-directory: tet-network/ui`, which does not exist yet on the cheap
        # path, and bash cannot start in a missing directory: run 36856444106 failed with
        # "An error occurred trying to start process '/usr/bin/bash' with working directory
        # '.../tet-network/ui'. No such file or directory" — a green-looking job design brought down
        # by its own skip step. Set on every job so the next one to gain a `defaults` block does not
        # rediscover this.
        working-directory: .
        run: |
          echo 'Only documentation changed; nothing in this job can be broken by it.'
          echo "Reporting success so the required check 'wasm (tet-pqc-wasm → ui/public/pqc)' is satisfied."

      - if: needs.gate.outputs.code == 'true'
        uses: actions/checkout@v4

      - if: needs.gate.outputs.code == 'true'
        name: Install Rust (wasm32 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - if: needs.gate.outputs.code == 'true'
        name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - if: needs.gate.outputs.code == 'true'
        name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          key: wasm-${{ hashFiles('**/Cargo.lock') }}

      # THERE MUST BE EXACTLY ONE COMMITTED COPY OF THE SIGNER.
      #
      # It is `tet-agent-sdk/vendor/`, which the SDK packs. `tet-network/ui/public/pqc/` is a BUILD
      # OUTPUT — that directory carries its own `.gitignore` containing `*`, so a fresh clone has no
      # copy there and the UI cannot sign until this job runs.
      #
      # The previous version of this step compared the two as "the two committed copies", and failed
      # on its first ever execution (run 36846005558) because one of them does not exist in a clean
      # checkout. It passed locally only because a developer's tree holds the gitignored build
      # output. A guard that has never run is a guess, and this one was wrong about the repository.
      #
      # What is worth enforcing is the real intent: no SECOND committed copy, ever, because two
      # committed copies are one artifact with two chances to go stale.
      - if: needs.gate.outputs.code == 'true'
        name: Exactly one committed copy of the signer
        run: |
          set -euo pipefail
          tracked=$(git ls-files 'tet-network/ui/public/pqc' | wc -l | tr -d ' ')
          if [ "$tracked" != "0" ]; then
            echo "::error::tet-network/ui/public/pqc is a build output and must not be committed."
            git ls-files 'tet-network/ui/public/pqc'
            echo "Keep ONE committed copy (tet-agent-sdk/vendor/) so there is nothing to drift."
            exit 1
          fi
          for f in tet_pqc_wasm.js tet_pqc_wasm_bg.wasm; do
            test -s "tet-agent-sdk/vendor/$f" || {
              echo "::error::tet-agent-sdk/vendor/$f missing — the SDK cannot sign without it"
              exit 1
            }
            echo "ok  tet-agent-sdk/vendor/$f  $(shasum -a 256 "tet-agent-sdk/vendor/$f" | cut -c1-12)"
          done

      - if: needs.gate.outputs.code == 'true'
        name: The committed signer reproduces the interop fixture
        run: node tet-agent-sdk/scripts/check_wasm_interop.mjs tet-agent-sdk/vendor

      - if: needs.gate.outputs.code == 'true'
        name: Install wasm-pack
        run: cargo install wasm-pack --locked

      # Exactly the command docs/RUNNING_A_NODE.md tells an operator to run, except that it builds
      # to a scratch directory so the committed copies survive for the comparison below.
      - if: needs.gate.outputs.code == 'true'
        name: Build tet-pqc-wasm
        run: |
          wasm-pack build tet-pqc-wasm \
            --target web \
            --out-dir "$RUNNER_TEMP/pqc"

      - if: needs.gate.outputs.code == 'true'
        name: Verify the four artifacts landed
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/pqc"
          for f in tet_pqc_wasm.js tet_pqc_wasm_bg.wasm tet_pqc_wasm.d.ts tet_pqc_wasm_bg.wasm.d.ts; do
            test -s "$f" || { echo "::error::$f missing or empty — the UI cannot sign without it"; exit 1; }
            echo "ok  $f ($(stat -c%s "$f") bytes)"
          done
          # A wasm module that does not start with the magic bytes is not a wasm module.
          head -c4 tet_pqc_wasm_bg.wasm | od -An -tx1 | grep -q '00 61 73 6d'

      # The guard that would catch a source change altering what the signer produces: a freshly
      # built signer must still reproduce the committed fixture that Rust verifies. Controlled on
      # 2026-09-30 by changing the signing-randomness label in tet-pqc-wasm/src/lib.rs and
      # rebuilding — all four signatures mismatched and this step exits 1.
      - if: needs.gate.outputs.code == 'true'
        name: A freshly built signer reproduces the interop fixture
        run: node tet-agent-sdk/scripts/check_wasm_interop.mjs "$RUNNER_TEMP/pqc"

      # Informational only, for the reason in the step above: a byte difference is expected whenever
      # rustc / wasm-bindgen / wasm-opt move, and is NOT a failure. Pinning those three is the
      # follow-up that would make a byte diff honest.
      - if: needs.gate.outputs.code == 'true'
        name: Report byte drift between the fresh build and the committed signer
        run: |
          set -euo pipefail
          for f in tet_pqc_wasm.js tet_pqc_wasm_bg.wasm; do
            a=$(shasum -a 256 "$RUNNER_TEMP/pqc/$f" | cut -d' ' -f1)
            b=$(shasum -a 256 "tet-agent-sdk/vendor/$f" | cut -d' ' -f1)
            if [ "$a" = "$b" ]; then
              echo "$f  identical (${a:0:12})"
            else
              echo "::notice::$f differs from the committed signer (fresh ${a:0:12}, committed ${b:0:12}) — expected across toolchain versions; behaviour is asserted above"
            fi
          done

      - if: needs.gate.outputs.code == 'true'
        name: Upload pqc artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tet-pqc-wasm
          path: ${{ runner.temp }}/pqc/
          retention-days: 14

  docker:
    name: docker (images build)
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # This job ALWAYS starts, including for a docs-only commit, so its check name is
      # always reported. A job skipped by a job-level `if:` reports "skipped", which a
      # required-checks ruleset does not accept as a pass — the same trap as the no-op
      # mirror this replaces. So the JOB runs and the WORK is conditional.
      - name: Docs-only commit — skipping the work, not the check
        if: needs.gate.outputs.code != 'true'
        # Explicit, because this step runs BEFORE the checkout it is replacing. The `ui` job sets
        # `defaults.run.working-directory: tet-network/ui`, which does not exist yet on the cheap
        # path, and bash cannot start in a missing directory: run 36856444106 failed with
        # "An error occurred trying to start process '/usr/bin/bash' with working directory
        # '.../tet-network/ui'. No such file or directory" — a green-looking job design brought down
        # by its own skip step. Set on every job so the next one to gain a `defaults` block does not
        # rediscover this.
        working-directory: .
        run: |
          echo 'Only documentation changed; nothing in this job can be broken by it.'
          echo "Reporting success so the required check 'docker (images build)' is satisfied."

      - if: needs.gate.outputs.code == 'true'
        uses: actions/checkout@v4

      - if: needs.gate.outputs.code == 'true'
        uses: docker/setup-buildx-action@v3

      # Build only — nothing is run or pushed. The point is that a broken
      # Dockerfile fails the PR instead of failing the next operator who types
      # `docker compose up`, which is exactly how this repo shipped a UI
      # Dockerfile that no compose service ever referenced.
      #
      # RISC0_SKIP_BUILD=1 here: the zk guests add tens of minutes and the
      # Dockerfile path that installs the risc0 toolchain is unchanged by any of
      # this. Compose still defaults to the full zk build for deployments.
      - if: needs.gate.outputs.code == 'true'
        name: Build tet-core image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          build-args: |
            RISC0_SKIP_BUILD=1
            TET_BUILD_FEATURES=
          cache-from: type=gha,scope=tet-core
          cache-to: type=gha,mode=max,scope=tet-core

      # Context is the repo root, not tet-network/ui: stage 1 builds
      # tet-pqc-wasm from the Rust workspace and bakes it into public/pqc.
      - if: needs.gate.outputs.code == 'true'
        name: Build ui image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tet-network/ui/Dockerfile
          push: false
          build-args: |
            NEXT_PUBLIC_TET_TREASURY_ADDRESS=fedcba0987654321fedcba0987654321fedcba0987654321fedcba0987654321
            NEXT_PUBLIC_TET_GENESIS_FOUNDER_WALLET_ID=57e0b29d233917a619d0f335dfc1135add3359c49590720cfb0f9f70d71f36a0
            NEXT_PUBLIC_TET_CHAIN_ID=tet-local-dev
          cache-from: type=gha,scope=ui
          cache-to: type=gha,mode=max,scope=ui

      - if: needs.gate.outputs.code == 'true'
        name: Validate docker-compose.yml
        run: docker compose config --quiet
