# Companion to ci.yml. Same workflow name, same five job names, no work.
#
# WHY THIS EXISTS. ci.yml skips itself on docs-only commits via paths-ignore, which
# saves roughly 50 billed minutes per such push. But a skipped workflow reports NO
# status at all — it does not report success. The moment CI is made a required check
# in branch protection, every docs-only pull request would sit permanently
# unmergeable, waiting for a check that is never going to arrive.
#
# This is GitHub's documented answer: a second workflow, triggered on exactly the
# paths the first one ignores, declaring jobs with IDENTICAL names that do nothing and
# exit 0. Whichever workflow runs, the five required check names are always reported.
#
# THE TWO FILES MUST BE KEPT IN LOCKSTEP:
#   * `name:` here must equal `name:` in ci.yml                      (currently "CI")
#   * the five job ids and their `name:` values must match exactly — the required
#     check is identified by that name, so "rust (build, test, guards)" is a literal
#     string that branch protection will look for
#   * `paths:` here must be the exact complement of `paths-ignore:` in ci.yml
# Change one, change the other, or docs-only PRs quietly become unmergeable again.
#
# COST, stated plainly: five jobs at GitHub's one-minute-minimum billing is ~5 billed
# minutes per docs-only push, against the ~50 that ci.yml would have cost. Over the 21
# docs-only commits in the 30 to 2026-09-28 that is ~84 minutes a month rather than
# ~1,050. The saving is smaller than paths-ignore alone, and it is the price of being
# able to require the check at all.

name: CI

on:
  push:
    branches: [main]
    paths: &docs_only
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE-APACHE'
      - 'LICENSE-MIT'
      - '.gitignore'
  pull_request:
    paths: *docs_only

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: rust (build, test, guards)
    runs-on: ubuntu-latest
    steps:
      - run: echo "docs-only change — no Rust source touched, nothing to build or test."

  ui:
    name: ui (next build)
    runs-on: ubuntu-latest
    steps:
      - run: echo "docs-only change — no UI source touched, nothing to build."

  shell:
    name: shell (shellcheck deploy scripts)
    runs-on: ubuntu-latest
    steps:
      - run: echo "docs-only change — no shell script touched, nothing to check."

  wasm:
    name: wasm (tet-pqc-wasm → ui/public/pqc)
    runs-on: ubuntu-latest
    steps:
      - run: echo "docs-only change — no wasm source touched, nothing to build."

  docker:
    name: docker (images build)
    runs-on: ubuntu-latest
    steps:
      - run: echo "docs-only change — no Dockerfile or build context touched."
