# CodeQL for javascript-typescript and rust: on pushes to main, on pull requests, and weekly.
# Report only: findings go to the repository's code-scanning alerts; this workflow never pushes,
# commits or opens a pull request. Advanced setup because the default-setup API does not accept
# "rust" as a language (2026-11-13: HTTP 422, "rust is not a possible value"). Both languages
# need no build (build-mode: none), so nothing here compiles the workspace.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 2"
  workflow_dispatch:

# A literal group, never github.workflow (scripts/lint_workflows.py; CLAUDE.md).
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, rust]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # The scan leaves out one folder and nothing else: the pinned upstream three.js that the
          # PX4 replay page loads (prep/demos/robot-sim/px4/vendor/three). Those files are upstream's
          # release, unchanged; their sha256 are listed in that folder's SHA256SUMS. The demo-files
          # guard (prep/demos/guards/test_demo_files.py) reads this list and refuses any entry that is
          # not a folder under prep/demos whose every file, other than its LICENSE, is pinned there.
          config: |
            paths-ignore:
              - prep/demos/robot-sim/px4/vendor/three
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          category: /language:${{ matrix.language }}
