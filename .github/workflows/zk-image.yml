name: zk image (on demand)

# Builds the node image WITH the RISC Zero guests — the production default in
# docker-compose.yml (RISC0_SKIP_BUILD=0, --features zk-prove).
#
# Deliberately not on push. Installing the risc0 toolchain and building the zkVM
# guests takes tens of minutes, which is why every other job passes
# RISC0_SKIP_BUILD=1. The cost of that was a production image path nobody built
# for months: `cargo risczero install` was removed upstream in favour of `rzup`
# and the image simply stopped building, discovered only when provisioning the
# public seed on 2026-09-22.
#
# Run this after touching the Dockerfile, the risc0 dependency versions, or the
# guests under methods/ and prover/.

on:
  workflow_dispatch:
  schedule:
    # Monthly, so the path cannot rot silently between manual runs.
    - cron: '0 4 1 * *'

permissions:
  contents: read

jobs:
  zk-image:
    name: build node image with zk-prove
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h / | tail -1

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build (RISC0_SKIP_BUILD=0, --features zk-prove)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: false
          build-args: |
            RISC0_SKIP_BUILD=0
            TET_BUILD_FEATURES=zk-prove
          cache-from: type=gha,scope=zk-image
          cache-to: type=gha,mode=max,scope=zk-image
