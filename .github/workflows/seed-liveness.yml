name: seed liveness

# External reachability check for the public seed. This tests the two things the
# on-box probe cannot, because both are statements about the view FROM THE
# INTERNET rather than from the host:
#
#   * 8002 IS reachable  — the Hetzner cloud firewall and routing are intact
#   * 5010 is NOT reachable — the node's REST API has not become public
#
# Everything else about the seed — chain progress, host health, liveness — is
# covered by deploy/seed-healthcheck.sh pinging healthchecks.io every minute,
# which is both more timely and free.
#
# INTERVAL: every 6 hours, deliberately. It ran every 15 minutes until
# 2026-09-28, which is 2,880 runs a month; GitHub bills each job at a ONE MINUTE
# MINIMUM regardless of how long it takes, so this 8-second check was consuming
# ~2,880 of the 2,000 free private-repo minutes on its own and had blocked all
# CI on the account. Six hours costs 120 minutes a month.
#
# Losing timeliness costs nothing here: healthchecks.io already alerts within a
# minute if the seed dies. What this job catches is a firewall or routing change,
# which is a thing someone does, not a thing that happens spontaneously — and a
# 15-minute cadence was never the real detection window anyway, because GitHub's
# scheduled runners are best-effort and routinely 15-60+ minutes late under load.
#
# Still true: GitHub disables scheduled workflows after 60 days with no repository
# activity. This project has already been dormant for three months once, so that
# is a realistic way for this check to stop silently. If the repo goes quiet,
# re-enable it in the Actions tab.

on:
  schedule:
    # Every 6 hours. See the INTERVAL note above before making this more frequent:
    # the one-minute-minimum billing makes cadence, not duration, the whole cost.
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reachable:
    name: p2p port reachable from the internet
    runs-on: ubuntu-latest
    steps:
      - name: TCP connect to the seed's block-plane port
        env:
          SEED_HOST: 95.217.158.153
          SEED_P2P_PORT: '8002'
        run: |
          set -euo pipefail
          echo "connecting to ${SEED_HOST}:${SEED_P2P_PORT}"
          for attempt in 1 2 3; do
            if timeout 10 bash -c ">/dev/tcp/${SEED_HOST}/${SEED_P2P_PORT}" 2>/dev/null; then
              echo "::notice::seed ${SEED_HOST}:${SEED_P2P_PORT} reachable (attempt ${attempt})"
              exit 0
            fi
            echo "attempt ${attempt} failed"
            sleep 10
          done
          echo "::error::seed ${SEED_HOST}:${SEED_P2P_PORT} NOT reachable from the internet after 3 attempts"
          exit 1

      - name: REST must NOT be reachable
        env:
          SEED_HOST: 95.217.158.153
        run: |
          set -euo pipefail
          # 5010 is published on the seed's loopback only and blocked upstream by
          # the Hetzner firewall. If this ever succeeds, the node's API is public.
          if timeout 10 bash -c ">/dev/tcp/${SEED_HOST}/5010" 2>/dev/null; then
            echo "::error::seed REST port 5010 is reachable from the internet — it must not be"
            exit 1
          fi
          echo "::notice::5010 correctly not reachable"
