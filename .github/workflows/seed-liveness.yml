name: seed liveness

# Two questions about the public seeds, both answered from OUTSIDE the hosts:
#
#   1. LIVENESS — is each seed's chain advancing? Read from healthchecks.io's Management API: every
#      check in the project must be "up". The on-box probe (deploy/seed-healthcheck.sh) pings a
#      check's success only when that seed's height advanced, so "up" means "made progress in the
#      last few minutes", and down/grace/new/paused all fail this job.
#   2. EXPOSURE — is the P2P port reachable from the internet, and REST NOT reachable? The on-box
#      probe cannot see the firewall from the inside.
#
# Until 2026-10-04 this job only did a TCP connect to the P2P port and was called liveness. The
# kernel accepts that connection into the listen backlog even while the node above it is wedged,
# so it stayed green through a 33 h outage (docs/postmortems/2026-10-04-producer-wedge-33h.md).
# A liveness check that cannot go red is worse than none. The TCP connect is still here, as what
# it is: an exposure check.
#
# Needs the repository secret HC_API_KEY_READONLY (healthchecks.io → project Settings → API Access
# → read-only key). Without it the job FAILS: it must never pass because it could not look.
#
# INTERVAL: every 6 hours, deliberately. It ran every 15 minutes until
# 2026-09-28, which is 2,880 runs a month; GitHub bills each job at a ONE MINUTE
# MINIMUM regardless of how long it takes, so this 8-second check was consuming
# ~2,880 of the 2,000 free private-repo minutes on its own and had blocked all
# CI on the account. Six hours costs 120 minutes a month.
#
# Losing timeliness costs nothing here: healthchecks.io alerts a person within a minute (push
# channel, RUNNING_A_NODE § Alerts that reach a person). This job is the cross-check that the alert
# path itself is configured and that both checks are up.
#
# Still true: GitHub disables scheduled workflows after 60 days with no repository
# activity. This project has already been dormant for three months once, so that
# is a realistic way for this check to stop silently. If the repo goes quiet,
# re-enable it in the Actions tab.

on:
  schedule:
    # Every 6 hours. See the INTERVAL note above before making this more frequent:
    # the one-minute-minimum billing makes cadence, not duration, the whole cost.
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reachable:
    name: seeds are live (healthchecks.io) and exposed correctly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: healthchecks.io reports every seed check up
        env:
          HC_API_KEY: ${{ secrets.HC_API_KEY_READONLY }}
        run: |
          set -euo pipefail
          if [ -z "${HC_API_KEY:-}" ]; then
            echo "::error::secret HC_API_KEY_READONLY is not set; this job cannot see liveness and refuses to pass"
            exit 1
          fi
          curl -fsS -m 20 -H "X-Api-Key: ${HC_API_KEY}" https://healthchecks.io/api/v3/checks/ > checks.json
          # tet-demo: the demo host isn't provisioned yet, so its check has never pinged ("new").
          # Allowed only as "new"; remove this flag when the demo goes live.
          python3 scripts/hc_status.py --min-checks 2 --not-yet-live tet-demo checks.json

      - name: P2P port reachable from the internet (exposure, not liveness)
        run: |
          set -euo pipefail
          for host in 95.217.158.153 46.224.223.54; do
            ok=0
            for attempt in 1 2 3; do
              if timeout 10 bash -c ">/dev/tcp/${host}/8002" 2>/dev/null; then ok=1; break; fi
              echo "${host}: attempt ${attempt} failed"; sleep 10
            done
            if [ "$ok" = 1 ]; then echo "::notice::${host}:8002 reachable"; else
              echo "::error::${host}:8002 NOT reachable from the internet after 3 attempts"; exit 1; fi
          done

      - name: REST must NOT be reachable
        run: |
          set -euo pipefail
          for host in 95.217.158.153 46.224.223.54; do
            if timeout 10 bash -c ">/dev/tcp/${host}/5010" 2>/dev/null; then
              echo "::error::${host}: REST port 5010 is reachable from the internet — it must not be"
              exit 1
            fi
            echo "::notice::${host}:5010 correctly not reachable"
          done
