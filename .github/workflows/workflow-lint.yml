name: workflow lint

# Separate from ci.yml on purpose: if ci.yml is malformed, GitHub runs none of it, so it can't
# report its own breakage. This file checks every workflow for duplicated keys (scripts/workflow_dupkeys.py).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: workflow files parse without duplicate keys
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -m pip install --quiet --user pyyaml==6.0.2
      - run: python3 scripts/workflow_dupkeys.py .github/workflows/*.yml
