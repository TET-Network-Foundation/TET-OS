[package]
name = "nexus-wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom_0_2 = { package = "getrandom", version = "0.2", features = ["js"] }
libp2p = { version = "0.55", default-features = false, features = ["macros", "ping", "identify", "ed25519", "wasm-bindgen"] }
libp2p-webrtc-websys = "0.4.0"
futures = "0.3"
web-sys = { version = "0.3", features = [
  "console",
  "Window",
  "Request",
  "RequestInit",
  "RequestMode",
  "Response",
  "Headers",

  "IdbFactory",
  "IdbOpenDbRequest",
  "IdbDatabase",
  "IdbTransaction",
  "IdbTransactionMode",
  "IdbObjectStore",
  "IdbRequest",
  "IdbVersionChangeEvent",
  "Event",
  "DomStringList",
] }
base64 = "0.22"
bincode = "1.3"
hex = "0.4"
bip39 = { version = "2", default-features = false, features = ["std", "rand"] }
ed25519-dalek = { version = "2", default-features = false, features = ["rand_core"] }
risc0-zkvm = { version = "3.0.5", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nexus-protocol = { path = "../nexus-protocol", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tet-core = { path = "../tet-core" }
